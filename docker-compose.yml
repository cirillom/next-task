services:
  next-task:
    build: .
    container_name: next-task-dev
    ports:
      - "8000:8000"
    environment:
      TZ: America/Sao_Paulo
      NEXT_TASK_COOKIE_SECURE: "false"
      NEXT_TASK_CREDENTIAL_SECRET: "${NEXT_TASK_CREDENTIAL_SECRET:-development-only-next-task-credential-secret}"
      NEXT_TASK_MCP_PUBLIC_URL: "${NEXT_TASK_MCP_PUBLIC_URL:-http://localhost:8001}"
    volumes:
      - ./data-dev:/data

  next-task-mcp:
    build: .
    container_name: next-task-mcp-dev
    command: ["uv", "run", "uvicorn", "app.mcp_app:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      TZ: America/Sao_Paulo
      NEXT_TASK_CREDENTIAL_SECRET: "${NEXT_TASK_CREDENTIAL_SECRET:-development-only-next-task-credential-secret}"
      NEXT_TASK_MCP_PUBLIC_URL: "${NEXT_TASK_MCP_PUBLIC_URL:-http://localhost:8001}"
    volumes:
      - ./data-dev:/data
    depends_on:
      next-task:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
