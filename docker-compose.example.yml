services:
  next-task:
    build: .
    container_name: next-task
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TZ: America/Sao_Paulo
      # Keep true when the app is reached over HTTPS through your reverse proxy.
      NEXT_TASK_COOKIE_SECURE: "true"
    volumes:
      - /mnt/hdd/next-task/data:/data

