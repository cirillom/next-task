# Reference deployment for ~/services/next-task/docker-compose.yml.

services:
  next-task:
    image: ghcr.io/cirillom/next-task:latest
    container_name: next-task
    restart: always

    environment:
      TZ: America/Sao_Paulo
      NEXT_TASK_COOKIE_SECURE: "true"
      NEXT_TASK_CREDENTIAL_SECRET: "${NEXT_TASK_CREDENTIAL_SECRET:?set NEXT_TASK_CREDENTIAL_SECRET}"
      NEXT_TASK_PUBLIC_APP_URL: "${NEXT_TASK_PUBLIC_APP_URL:-}"
      NEXT_TASK_SMTP_HOST: "${NEXT_TASK_SMTP_HOST:-}"
      NEXT_TASK_SMTP_PORT: "${NEXT_TASK_SMTP_PORT:-587}"
      NEXT_TASK_SMTP_SECURITY: "${NEXT_TASK_SMTP_SECURITY:-starttls}"
      NEXT_TASK_SMTP_USERNAME: "${NEXT_TASK_SMTP_USERNAME:-}"
      NEXT_TASK_SMTP_PASSWORD: "${NEXT_TASK_SMTP_PASSWORD:-}"
      NEXT_TASK_SMTP_FROM_EMAIL: "${NEXT_TASK_SMTP_FROM_EMAIL:-}"
      FORWARDED_ALLOW_IPS: "${NEXT_TASK_TRUSTED_PROXY_IPS:?set to the reverse proxy IP or CIDR}"

    volumes:
      - /mnt/hdd/next-task/data:/data

    networks:
      - proxy

networks:
  proxy:
    external: true
